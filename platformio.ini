; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[env]
framework = arduino
platform = espressif32@^8.0.0
upload_protocol = esptool
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	time
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_unflags =
	-std=gnu++11
	-Os
extra_scripts = pre:scripts/patch_hub75.py
build_flags =
	-std=gnu++17
	-O2
	-DCUSTOMBOARD
	-DUSE_GFX_LITE
lib_deps =
	https://github.com/mrcodetastic/GFX_Lite#8088993f2f91aaba07843d987d0c2bfd120328b7
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
	h2zero/NimBLE-Arduino@^2.5.2
	depau/APDS-9930 Ambient Light and Proximity Sensor@^1.0.0
	pololu/VL6180X@^1.3.1
	adafruit/Adafruit LIS3DH@^1.3.0
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit NeoPixel@^1.15.4
	olikraus/U8g2@^2.0.0

; ============================================================================
; Shared Debug/Release Base Environments
; ============================================================================

[env:debug-base]
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=2
	-DENABLE_RGB_STATUS_LED=1

[env:release-base]
build_flags =
	${env.build_flags}
	-DCORE_DEBUG_LEVEL=0
	-O2
	-DNDEBUG
	-DENABLE_RGB_STATUS_LED=0
	-DDISABLE_SERIAL_LOGGING=1

; ============================================================================
; Board-Specific Environments
; ============================================================================

; Kimmix Controller V2 - Custom Board (Debug)
[env:KimmixControllerV2]
extends = env:debug-base
board = kmmx-protogen-v2
build_flags =
	${env:debug-base.build_flags}
	-DBLE_DEVICE_NAME=\"KimmixControllerV2\"
	-DBLE_LOCAL_NAME=\"KMMX-Debug\"

; Kimmix Controller V2 - Custom Board (Release)
[env:KimmixControllerV2-release]
extends = env:release-base
board = kmmx-protogen-v2
build_flags =
	${env:release-base.build_flags}
	-DBLE_DEVICE_NAME=\"KimmixControllerV2\"
	-DBLE_LOCAL_NAME=\"KMMX\"

; Kimmix Controller V4 - Custom Board (Debug)
[env:KimmixControllerV4]
extends = env:debug-base
board = kmmx-protogen-v4
build_flags =
	${env:debug-base.build_flags}
	-DBLE_DEVICE_NAME=\"KimmixControllerV4\"
	-DBLE_LOCAL_NAME=\"KMMX-V4-Debug\"

; Kimmix Controller V4 - Custom Board (Release)
[env:KimmixControllerV4-release]
extends = env:release-base
board = kmmx-protogen-v4
build_flags =
	${env:release-base.build_flags}
	-DBLE_DEVICE_NAME=\"KimmixControllerV4\"
	-DBLE_LOCAL_NAME=\"KMMX-V4\"
